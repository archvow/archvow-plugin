# CI of archvow's IDE plugins (IntelliJ and VS Code), as archvow's own CI does for the engine: run the
# plugins' tests against the contract and against a real archvow, build both packages, then check the
# packages themselves before they are published internally (a JetBrains updatePlugins.xml, a
# self-hosted Open VSX, a share). The packages of each run are kept as the artifact "archvow-plugins".
#
# archvow itself is in the repository: contract/archvow/ holds the wheel of the version the contract
# was recorded from (contract/cli/version.txt) and, from archvow's source, its three examples and
# docs/rules*.md. Nothing is fetched from archvow's repository. Behind a proxy, point the Gradle wrapper,
# the IntelliJ repositories, npm (npm_config_registry) and pip (PIP_INDEX_URL) at your mirrors.
name: CI

on:
  push:
    branches: ['**']
    # 1.1.0: a release is a tag - v1.1.0 (stable), v1.2.0-beta (pre-release); a push to a branch only tests
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a release in progress (a tag's run).
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # VS Code: the extension's tests (the .vow reader against the Java one's contract, the CLI runner, the
  # workspace, the wiki, the release checks: one version, the same rules as IntelliJ, archvow's grammar),
  # then the .vsix. The live and package tests skip themselves here: their own jobs run them.
  vscode:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: vscode } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: vscode/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: dist/*.vsix, if-no-files-found: error }

  # IntelliJ: the .vow reader on the shared vows (coreTest), the workspace's headless regressions
  # (workspaceTest), the plugin .zip; then the Java reader must still write the committed
  # contract/vow-reader/expected.json - the file the VS Code reader is tested against: both readers agree.
  intellij:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: intellij } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --console=plain check buildPlugin contractDump
      - name: The Java .vow reader still gives the recorded contract
        run: |
          git diff --exit-code -- ../contract/vow-reader/ || {
            echo "::error::The Java .vow reader changed: run ./gradlew contractDump, check npm test, commit contract/vow-reader/expected.json"
            exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: intellij, path: intellij/build/distributions/archvow-intellij-*.zip, if-no-files-found: error }

  # The plugin against the IDE releases JetBrains recommends (0.26.1): untilBuild is open, so the IntelliJ Plugin
  # Verifier is what says a newer IDE still has every API the plugin calls. Its own job: it downloads several IDEs.
  intellij-verify:
    runs-on: ubuntu-latest
    needs: [intellij]
    defaults: { run: { working-directory: intellij } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --console=plain verifyPlugin

  # The contract is what archvow really prints: regenerated with the archvow of contract/archvow/ (its
  # wheel, its examples), it must be exactly what is committed (both plugins are tested against it).
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: A release tag names the version the files say
        run: python -m unittest discover -s .github/scripts -p 'test_release_version.py'
      - run: pip install -q contract/archvow/archvow-*-py3-none-any.whl && python -m archvow --version
      - run: python contract/tools/regenerate.py contract/archvow --python python
      - name: contract/ is unchanged
        run: |
          git status --porcelain -- contract/
          git diff --exit-code --stat -- contract/ && test -z "$(git status --porcelain -- contract/)" || {
            git diff -- contract/ | head -80
            echo "::error::contract/ is not what this archvow prints: run contract/tools/regenerate.py and commit the diff"
            exit 1; }

  # The extension against a real archvow, run as the extension runs it (no shell, JSON from stdout): the
  # installed version is the one the plugin knows, every output on archvow's three examples (with their
  # code) is exactly the contract, read-only commands change no vow, a change and a removal round-trip.
  live:
    runs-on: ubuntu-latest
    env:
      ARCHVOW_LIVE: required
      ARCHVOW_PYTHON: /tmp/venv/bin/python
      ARCHVOW_SOURCE: ${{ github.workspace }}/contract/archvow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: vscode/package-lock.json }
      - run: python -m venv /tmp/venv && /tmp/venv/bin/pip install -q contract/archvow/archvow-*-py3-none-any.whl
      - working-directory: vscode
        run: npm ci --no-audit --no-fund && npm run compile && node --test out/test/live.test.js

  # What a team installs, opened as the IDEs open it: the .vsix and the IntelliJ .zip of this run, their
  # manifests, the classes and files they name, the contract inside, no test, no source, no missing module.
  packages:
    runs-on: ubuntu-latest
    needs: [vscode, intellij]
    env:
      PACKAGES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -l dist/
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: vscode/package-lock.json }
      - working-directory: vscode
        run: npm ci --no-audit --no-fund && npm run compile && node --test out/test/package.test.js
      - uses: actions/upload-artifact@v4
        with: { name: archvow-plugins, path: dist/, if-no-files-found: error }

  # 1.1.0: published from a tag only - v1.1.0 stable (the tag on main), v1.2.0-beta a pre-release - once every job
  # passed and the tag names the version every release file says. No publication from a branch or a pull request.
  publish:
    name: Publish both Marketplaces (from a tag)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [vscode, intellij, intellij-verify, contract, live, packages]
    runs-on: ubuntu-latest
    # Serialize cross-branch uploads to the two Marketplace identities.
    concurrency:
      group: marketplace-publishing
      cancel-in-progress: false
    env:
      ARCHVOW_MARKETPLACE_CHANNEL: ${{ endsWith(github.ref_name, '-beta') && 'beta' || 'stable' }}
    permissions:
      contents: read
      id-token: write  # VS Code Marketplace Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # a stable tag must be a commit of main (merge-base below)
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: vscode/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4

      - name: The tag names the version every release file says
        shell: bash
        run: |
          read -r version channel < <(python .github/scripts/release-version.py --check-tag "$GITHUB_REF_NAME")
          [ "$channel" = "$ARCHVOW_MARKETPLACE_CHANNEL" ] || { echo "::error::channel $channel, expected $ARCHVOW_MARKETPLACE_CHANNEL"; exit 1; }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: A stable release is a commit of main
        if: env.ARCHVOW_MARKETPLACE_CHANNEL == 'stable'
        shell: bash
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main: tag the merged release commit of main"; exit 1; }
      - name: Check JetBrains publishing credentials before publishing anything
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
        shell: bash
        run: |
          for name in PUBLISH_TOKEN PRIVATE_KEY PRIVATE_KEY_PASSWORD CERTIFICATE_CHAIN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing JetBrains secret for $name; see docs/marketplace-publishing.md"
              exit 1
            fi
          done
      - name: Rebuild and retest both plugins with the release version
        run: ./build.sh
      # A pre-release MUST be flagged in the VSIX manifest as well as in the
      # publish command. Keep the stable build script and normal CI unchanged.
      - name: Package beta VSIX with pre-release metadata
        if: env.ARCHVOW_MARKETPLACE_CHANNEL == 'beta'
        working-directory: vscode
        shell: bash
        run: |
          rm -f "../dist/archvow-${RELEASE_VERSION}.vsix"
          npx --no-install vsce package --pre-release --no-dependencies \
            --skip-license --allow-missing-repository \
            --out "../dist/archvow-${RELEASE_VERSION}.vsix"
      - name: Verify stable or beta VSIX metadata
        shell: bash
        run: |
          python - <<'PYCODE'
          import os
          import zipfile
          version = os.environ['RELEASE_VERSION']
          channel = os.environ['ARCHVOW_MARKETPLACE_CHANNEL']
          with zipfile.ZipFile(f'dist/archvow-{version}.vsix') as package:
              manifest = package.read('extension.vsixmanifest').decode('utf-8')
          marked_beta = 'Microsoft.VisualStudio.Code.PreRelease' in manifest
          assert marked_beta == (channel == 'beta'), (
              f'VSIX pre-release metadata mismatch: channel={channel}, flag={marked_beta}'
          )
          print(f'VSIX metadata verified: {version} ({channel})')
          PYCODE
      - name: Check packages of the exact release version
        working-directory: vscode
        env:
          PACKAGES_REQUIRED: "1"
        run: node --test out/test/package.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-release
          path: dist/
          if-no-files-found: error

      # Publish the already-tested VSIX; do not invoke vsce's git version/tag automation. vsce is the copy locked
      # in vscode/package-lock.json (4.1.0, the first with --oidc): nothing is downloaded at publish time.
      # --skip-duplicate allows a rerun when VS Code succeeded but JetBrains did not.
      - name: Publish VS Code Marketplace
        working-directory: vscode
        shell: bash
        run: |
          args=()
          if [[ "$ARCHVOW_MARKETPLACE_CHANNEL" == beta ]]; then
            args+=(--pre-release)
          fi
          npx --no-install vsce publish --oidc --skip-duplicate \
            --skip-license --allow-missing-repository "${args[@]}" \
            --packagePath "../dist/archvow-${RELEASE_VERSION}.vsix"

      # Gradle uses ARCHVOW_MARKETPLACE_CHANNEL to select the JetBrains beta
      # repository; stable publishes to the default Marketplace channel.
      # Signing still runs before publication.
      - name: Publish signed plugin to JetBrains Marketplace
        working-directory: intellij
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
        run: ./gradlew --no-daemon --console=plain publishPlugin

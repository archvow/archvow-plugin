# CI of archvow's IDE plugins (IntelliJ and VS Code), as archvow's own CI does for the engine: run the
# plugins' tests against the contract and against a real archvow, build both packages, then check the
# packages themselves before they are published internally (a JetBrains updatePlugins.xml, a
# self-hosted Open VSX, a share). The packages of each run are kept as the artifact "archvow-plugins".
#
# archvow itself is in the repository: contract/archvow/ holds the wheel of the version the contract
# was recorded from (contract/cli/version.txt) and, from archvow's source, its three examples and
# docs/rules*.md. Nothing is fetched from archvow's repository. Behind a proxy, point the Gradle wrapper,
# the IntelliJ repositories, npm (npm_config_registry) and pip (PIP_INDEX_URL) at your mirrors.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # VS Code: the extension's tests (the .vow reader against the Java one's contract, the CLI runner, the
  # workspace, the wiki, the release checks: one version, the same rules as IntelliJ, archvow's grammar),
  # then the .vsix. The live and package tests skip themselves here: their own jobs run them.
  vscode:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: vscode } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: vscode/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: dist/*.vsix, if-no-files-found: error }

  # IntelliJ: the .vow reader on the shared vows (coreTest), the workspace's headless regressions
  # (workspaceTest), the plugin .zip; then the Java reader must still write the committed
  # contract/vow-reader/expected.json - the file the VS Code reader is tested against: both readers agree.
  intellij:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: intellij } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --console=plain check buildPlugin contractDump
      - name: The Java .vow reader still gives the recorded contract
        run: |
          git diff --exit-code -- ../contract/vow-reader/ || {
            echo "::error::The Java .vow reader changed: run ./gradlew contractDump, check npm test, commit contract/vow-reader/expected.json"
            exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: intellij, path: intellij/build/distributions/archvow-intellij-*.zip, if-no-files-found: error }

  # The contract is what archvow really prints: regenerated with the archvow of contract/archvow/ (its
  # wheel, its examples), it must be exactly what is committed (both plugins are tested against it).
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q contract/archvow/archvow-*-py3-none-any.whl && python -m archvow --version
      - run: python contract/tools/regenerate.py contract/archvow --python python
      - name: contract/ is unchanged
        run: |
          git status --porcelain -- contract/
          git diff --exit-code --stat -- contract/ && test -z "$(git status --porcelain -- contract/)" || {
            git diff -- contract/ | head -80
            echo "::error::contract/ is not what this archvow prints: run contract/tools/regenerate.py and commit the diff"
            exit 1; }

  # The extension against a real archvow, run as the extension runs it (no shell, JSON from stdout): the
  # installed version is the one the plugin knows, every output on archvow's three examples (with their
  # code) is exactly the contract, read-only commands change no vow, a change and a removal round-trip.
  live:
    runs-on: ubuntu-latest
    env:
      ARCHVOW_LIVE: required
      ARCHVOW_PYTHON: /tmp/venv/bin/python
      ARCHVOW_SOURCE: ${{ github.workspace }}/contract/archvow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: vscode/package-lock.json }
      - run: python -m venv /tmp/venv && /tmp/venv/bin/pip install -q contract/archvow/archvow-*-py3-none-any.whl
      - working-directory: vscode
        run: npm ci --no-audit --no-fund && npm run compile && node --test out/test/live.test.js

  # What a team installs, opened as the IDEs open it: the .vsix and the IntelliJ .zip of this run, their
  # manifests, the classes and files they name, the contract inside, no test, no source, no missing module.
  packages:
    runs-on: ubuntu-latest
    needs: [vscode, intellij]
    env:
      PACKAGES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -l dist/
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: vscode/package-lock.json }
      - working-directory: vscode
        run: npm ci --no-audit --no-fund && npm run compile && node --test out/test/package.test.js
      - uses: actions/upload-artifact@v4
        with: { name: archvow-plugins, path: dist/, if-no-files-found: error }

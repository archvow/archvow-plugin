# Packaging of my-pipeline: `./entrypoint.sh --package` builds the wheel deployed with the
# pipeline (dist/my_pipeline-<version>-py3-none-any.whl), shipped to Spark with --py-files.
# Raise the version for every release. Development tools are in requirements.txt, ruff's rules
# in ruff.toml.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my_pipeline"
version = "0.1.0"
description = "PySpark pipeline for my_pipeline"
requires-python = ">=3.11"
# PySpark comes with the cluster. Packages approved with `-a dependencies=` that are not on the
# cluster are listed here, and shipped too (see README, "Running the pipeline").
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

# Test settings - a guard: changing them needs the architects' approval (ARCH020 in merge
# requests). Markers are strict, so a mistyped invariant marker fails instead of giving no evidence.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "invariant(id): the test of an archvow invariant (archvow show <component>, Invariants)",
    "decision(number): the test of a decision of the component's task (archvow prompt) (e.g. 3, or \"P1\")",
    "rule(id): the test of a project rule (e.g. \"R2\")",
    "example(name): the test of a business example, tests/examples/<component>/<name>/ (e.g. \"FATTRIB-012-paid\")",
    'integration: real I/O in a temporary folder; skip with -m "not integration"',
]

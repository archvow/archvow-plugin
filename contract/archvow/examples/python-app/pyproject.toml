# Packaging of invoicing (generated by archvow, template python-app): the package, its
# version, what it needs at run time and the settings of pytest and mypy. Raise the version for
# every release. Development tools are in requirements.txt, ruff's rules in ruff.toml.
# The src layout (code in src/invoicing/) makes the tests run the installed package, never
# a copy that happens to sit in the working folder.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoicing"
version = "0.1.0"
description = "Marks invoices paid, from the command line"
requires-python = ">=3.12"
# What the program needs at run time. Packages approved later with `-a dependencies=` are added
# here, by their pip name (import yaml -> pyyaml).
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

# Test settings - a guard: changing them needs the architects' approval (ARCH020 in merge
# requests). Markers are strict, so a mistyped invariant marker fails instead of giving no evidence.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "invariant(id): the test of an archvow invariant (see .archvow/spec.md, Invariants)",
    "decision(number): the test of a decision of the component's spec card (e.g. 3, or \"P1\")",
    "rule(id): the test of a project rule (e.g. \"R2\")",
    "example(name): the test of a business example, tests/examples/<component>/<name>/ (e.g. \"FATTRIB-012-paid\")",
    'integration: real files, a database or a fake transport in a temporary folder; skip with -m "not integration"',
]

# Type checks (make check): every function of the package is typed.
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["invoicing"]
disallow_untyped_defs = true
warn_unused_ignores = true

  intro_fr: "Chaque colonne étiquetée financial - les informations personnelles non publiques des clients - et les composants qui la lisent, la modifient et l'écrivent, avec ce que chacun a répondu sur le partage, l'accès, le chiffrement, la destruction, les incidents et les prestataires. Entrée du programme de sécurité de l'information et de la notice de confidentialité."

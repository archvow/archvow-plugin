# Packaging of orders-api (generated by archvow, template fastapi-service): the
# service's package, its version and what it needs at run time. Raise the version for every
# release. Development tools are in requirements.txt, ruff's rules in ruff.toml.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orders_api"
version = "0.1.0"
description = "Orders"
requires-python = ">=3.12"
# What the service needs at run time, with the packages approved with `-a dependencies=`, by their
# pip name (import yaml -> pyyaml). `init --force` writes this list again from the approvals.
dependencies = [
    "fastapi==0.143.*",
    "pydantic>=2",
    "pydantic-settings>=2",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

# Test settings - a guard: changing them needs the architects' approval (ARCH020 in merge
# requests). Markers are strict, so a mistyped invariant marker fails instead of giving no evidence.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "invariant(id): the test of an archvow invariant (see .archvow/spec.md, Invariants)",
    "decision(number): the test of a decision of the component's spec card (e.g. 3, or \"P1\")",
    "rule(id): the test of a project rule (e.g. \"R2\")",
    "example(name): the test of a business example, tests/examples/<component>/<name>/ (e.g. \"FATTRIB-012-paid\")",
    'integration: through the app or a real database in a temporary folder; skip with -m "not integration"',
]
